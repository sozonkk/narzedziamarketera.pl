<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B9D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C239B3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)" opacity="0.1"/>

  <!-- Main icon - Abstract marketing tools symbol -->
  <!-- Chart/Analytics bars -->
  <rect x="50" y="80" width="15" height="50" rx="7.5" fill="url(#grad1)" filter="url(#glow)"/>
  <rect x="75" y="60" width="15" height="70" rx="7.5" fill="url(#grad2)" filter="url(#glow)"/>
  <rect x="100" y="70" width="15" height="60" rx="7.5" fill="url(#grad1)" filter="url(#glow)"/>

  <!-- Marketing megaphone/funnel shape -->
  <path d="M 120 50 L 160 40 L 160 100 L 120 90 Z" fill="url(#grad2)" opacity="0.8" filter="url(#glow)"/>
  <circle cx="165" cy="70" r="8" fill="url(#grad1)" filter="url(#glow)"/>

  <!-- Connection dots -->
  <circle cx="57" cy="55" r="5" fill="#FF6B9D"/>
  <circle cx="82" cy="45" r="5" fill="#6366F1"/>
  <circle cx="107" cy="50" r="5" fill="#C239B3"/>

  <!-- Connecting lines -->
  <line x1="57" y1="55" x2="82" y2="45" stroke="#FF6B9D" stroke-width="2" opacity="0.3"/>
  <line x1="82" y1="45" x2="107" y2="50" stroke="#6366F1" stroke-width="2" opacity="0.3"/>
  <line x1="107" y1="50" x2="120" y2="50" stroke="#C239B3" stroke-width="2" opacity="0.3"/>
</svg>
